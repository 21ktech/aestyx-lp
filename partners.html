<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aestyx &mdash; For Medical Partners</title>
  <meta name="description" content="Join Aestyx's invitation-only network. We deliver high-ticket global patients with structured clinical briefs, pre-qualified and ready.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
  <link rel="stylesheet" href="css/shared.css">
  <style>
    .partner-cta-bar .waitlist-success { color: var(--gold); text-align: center; }
  </style>
</head>
<body>

  <!-- CONSTRUCTION BANNER -->
  <div class="construction-banner">
    <div class="phase-pill">
      <div class="phase-dot"></div>
      <span data-i18n="phase.label"></span>
    </div>
    <span class="banner-text" data-i18n="banner"></span>
  </div>

  <!-- NAV -->
  <nav>
    <a href="index.html" class="nav-logo">
      <span class="logo-dot"></span>
      AESTYX
    </a>
    <ul class="nav-links">
      <li><a href="index.html" data-i18n="nav.value"></a></li>
      <li><a href="security.html" data-i18n="nav.security"></a></li>
      <li><a href="financing.html" data-i18n="nav.financing"></a></li>
      <li><a href="index.html#procedures" data-i18n="nav.procedures"></a></li>
    </ul>
    <button class="nav-toggle" aria-label="Toggle navigation" onclick="toggleNav()">
      <i data-lucide="menu"></i>
    </button>
    <div class="nav-right">
      <a href="partners.html" class="nav-specialist active" data-i18n="footer.specialist"></a>
      <div class="lang-selector">
        <button class="lang-btn active" data-lang="en" onclick="setLanguage('en')">EN</button>
        <button class="lang-btn" data-lang="pt" onclick="setLanguage('pt')">PT</button>
      </div>
      <a href="index.html#waitlist" class="nav-cta" data-i18n="nav.cta"></a>
    </div>
  </nav>

  <!-- ══ PAGE HERO ══ -->
  <div class="page-hero">
    <div class="page-hero-content">
      <div class="page-hero-eyebrow">
        <div class="eyebrow-dot"></div>
        <span data-i18n="part.hero.eyebrow"></span>
      </div>
      <h1 data-i18n="part.hero.h1"></h1>
      <p class="page-hero-sub" data-i18n="part.hero.sub"></p>
    </div>
    <div class="ph-visual">
      <div class="ph-stat-card">
        <div class="ph-stat-icon"><i data-lucide="globe"></i></div>
        <div>
          <div class="ph-stat-label" data-i18n="ph.s1.label"></div>
          <div class="ph-stat-val" data-i18n="ph.s1.val"></div>
        </div>
      </div>
      <div class="ph-stat-card">
        <div class="ph-stat-icon"><i data-lucide="file-text"></i></div>
        <div>
          <div class="ph-stat-label" data-i18n="ph.s2.label"></div>
          <div class="ph-stat-val" data-i18n="ph.s2.val"></div>
        </div>
      </div>
      <div class="ph-stat-card">
        <div class="ph-stat-icon"><i data-lucide="badge-check"></i></div>
        <div>
          <div class="ph-stat-label" data-i18n="ph.s3.label"></div>
          <div class="ph-stat-val" data-i18n="ph.s3.val"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ VERIFY ROW ══ -->
  <div class="verify-row">
    <div class="verify-badge">
      <i data-lucide="badge-check"></i>
      <span data-i18n="badge.crm"></span>
    </div>
    <div class="verify-divider"></div>
    <div class="verify-badge">
      <i data-lucide="stethoscope"></i>
      <span data-i18n="badge.rqe"></span>
    </div>
    <div class="verify-divider"></div>
    <div class="verify-badge">
      <i data-lucide="shield-check"></i>
      <span data-i18n="badge.enc"></span>

      <i data-lucide="landmark"></i>
      <span data-i18n="badge.escrow"></span>

  <section class="partners" id="partners">
    <div class="partners-header">
      <div>
        <div class="section-kicker" data-i18n="part.kicker"></div>
        <div class="section-title" data-i18n="part.title"></div>
      </div>
      <p class="section-lead" data-i18n="part.lead"></p>
    </div>

    <div class="partner-benefits">
      <div class="pb-card">
        <span class="pb-icon"><i data-lucide="circle-dollar-sign"></i></span>
        <div class="pb-title" data-i18n="pb1.title"></div>
        <p class="pb-desc" data-i18n="pb1.desc"></p>
      </div>
      <div class="pb-card">
        <span class="pb-icon"><i data-lucide="file-text"></i></span>
        <div class="pb-title" data-i18n="pb2.title"></div>
        <p class="pb-desc" data-i18n="pb2.desc"></p>
      </div>
      <div class="pb-card">
        <span class="pb-icon"><i data-lucide="badge-check"></i></span>
        <div class="pb-title" data-i18n="pb3.title"></div>
        <p class="pb-desc" data-i18n="pb3.desc"></p>
      </div>
    </div>

    <div class="partner-cta-bar">
      <div class="pcb-left">
        <div class="pcb-kicker" data-i18n="pcb.kicker"></div>
        <div class="pcb-title" data-i18n="pcb.title"></div>
      </div>
      <div class="pcb-form">
        <input type="email" class="pcb-input" id="partner-email" data-i18n-placeholder="pcb.placeholder">
        <button class="btn-gold" onclick="handleWaitlist('partner-email','partner-success')" data-i18n="pcb.btn"></button>
      </div>
    </div>
    <p class="waitlist-success" id="partner-success" style="display:none;" data-i18n="waitlist.success"></p>
  </section>

  <!-- ══ VERIFICATION PROCESS ══ -->
  <section class="verification">
    <div class="section-kicker" data-i18n="ver.kicker"></div>
    <div class="section-title" data-i18n="ver.title"></div>

    <div class="ver-grid">
      <div class="ver-card">
        <div class="ver-step">01</div>
        <div class="ver-icon"><i data-lucide="user-check"></i></div>
        <div class="ver-title" data-i18n="ver1.title"></div>
        <p class="ver-desc" data-i18n="ver1.desc"></p>
        <div class="ver-badge" data-i18n="ver1.badge"></div>
      </div>
      <div class="ver-card">
        <div class="ver-step">02</div>
        <div class="ver-icon"><i data-lucide="stethoscope"></i></div>
        <div class="ver-title" data-i18n="ver2.title"></div>
        <p class="ver-desc" data-i18n="ver2.desc"></p>
        <div class="ver-badge" data-i18n="ver2.badge"></div>
      </div>
      <div class="ver-card">
        <div class="ver-step">03</div>
        <div class="ver-icon"><i data-lucide="shield-check"></i></div>
        <div class="ver-title" data-i18n="ver3.title"></div>
        <p class="ver-desc" data-i18n="ver3.desc"></p>
        <div class="ver-badge" data-i18n="ver3.badge"></div>
      </div>
    </div>
  </section>

    <div class="footer-brand">
      <a href="index.html" class="footer-logo"><span class="logo-dot"></span>AESTYX</a>

    </div>
    <div class="footer-grid">
      <div class="footer-col">
        <div class="footer-col-title" data-i18n="footer.col.experience"></div>
        <ul class="footer-links">
          <li><a href="index.html" data-i18n="nav.value"></a></li>
          <li><a href="index.html#procedures" data-i18n="nav.procedures"></a></li>
          <li><a href="financing.html" data-i18n="nav.financing"></a></li>
        </ul>
      </div>
      <div class="footer-col">
        <div class="footer-col-title" data-i18n="footer.col.ecosystem"></div>
        <ul class="footer-links">
          <li><a href="partners.html" class="active" data-i18n="footer.specialist"></a></li>
          <li><a href="security.html" data-i18n="footer.security"></a></li>
          <li><a href="club.html" data-i18n="footer.club"></a></li>
        </ul>
      </div>
      <div class="footer-col">
        <div class="footer-col-title" data-i18n="footer.col.legal"></div>
        <ul class="footer-links">
          <li><a href="#" data-i18n="footer.privacy"></a></li>
          <li><a href="#" data-i18n="footer.terms"></a></li>
          <li><a href="#" data-i18n="footer.contact"></a></li>
        </ul>
      </div>
    </div>
  </footer>
